<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Darkboard fixture — grade matching</title>

  <script>
    // Loaded through document.write so it stays synchronous while still carrying
    // a cache buster; http.server otherwise serves a stale helper and the
    // threshold assertions below quietly test the wrong code.
    document.write('<script src="contrast.js?cb=' + Date.now() + '"><\/script>');
  </script>

  <script>
    window.__cssReady = new Promise((resolve) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '../src/dark-mode.css?cb=' + Date.now();
      link.onload = resolve;
      link.onerror = resolve;
      document.head.appendChild(link);
    });

    // Browsers pause requestAnimationFrame in a hidden tab and the grade
    // observer debounces through it, so without this nothing gets stamped.
    (function () {
      const native = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = function (fn) {
        if (document.hidden) return setTimeout(() => fn(performance.now()), 0);
        return native(fn);
      };
    })();
  </script>
</head>
<body>

  <div class="gradebook-table">
    <span id="g-good">47 / 50</span>
    <span id="g-fair">Score: 42 / 50</span>
    <span id="g-average">36/50</span>
    <span id="g-poor">20 / 50</span>
    <span id="g-percent">88%</span>
    <!-- In a gradebook a calendar-range pair is a score, not a date. -->
    <span id="g-ambiguous">9/10</span>

    <table>
      <tr><td id="g-cell">47 / 50</td></tr>
    </table>
  </div>

  <ul class="activity-group">
    <li class="stream-item-container">
      <div class="stream-item">
        <span id="s-grade">Grade posted: 47 / 50</span>
      </div>
    </li>
    <li class="stream-item-container">
      <div class="stream-item">
        <!-- Same shape as a score, but the stream is full of dates. -->
        <span id="s-date">9/19</span>
      </div>
    </li>
  </ul>

  <div class="gradebook-table">
    <span id="r-attempt">Attempt 1 / 3</span>
    <span id="r-attempt-labelled">Attempt: 1 / 3</span>
    <span id="r-question">Question 4 / 10</span>
    <span id="r-page">Page 2 / 10</span>
    <span id="r-progress">50% complete</span>
    <span id="r-progress-labelled">Progress: 50%</span>
    <span id="r-duedate">due Fri 12/5</span>
  </div>

  <!-- Outside every known grade container. This is stamped now: scanning is no
       longer gated on container class names, because guessing those wrong is
       what silently killed the feature on the real gradebook. The anchored
       pattern and the keyword guards above are what hold back false positives,
       and the rejection cases prove they still do. -->
  <div id="outside-any-root">
    <span id="o-score">47 / 50</span>
  </div>

  <script>
    (function () {
      const listeners = [];
      window.chrome = {
        storage: {
          local: {
            get(_key, cb) { setTimeout(() => cb({ darkModeEnabled: true }), 0); },
            set() {},
          },
        },
        runtime: { onMessage: { addListener(fn) { listeners.push(fn); } } },
      };
    })();

    window.__probe = function (id) {
      const host = document.getElementById(id);
      // An inline host takes the pill itself; a block host gets a wrapper, so
      // the pill has to be looked for in both places.
      const pill = host.classList.contains('darkboard-pill')
        ? host
        : host.querySelector('.darkboard-pill');
      const styled = getComputedStyle(pill || host);

      return {
        status: (pill && pill.dataset.gradeStatus) || host.dataset.gradeStatus || null,
        pill: !!pill,
        wrapped: !!pill && pill !== host,
        display: getComputedStyle(host).display,
        color: styled.color,
        background: styled.backgroundColor,
      };
    };

    window.__scriptReady = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = '../src/content.js?cb=' + Date.now();
      s.onload = resolve;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
