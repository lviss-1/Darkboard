<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Darkboard fixture — grade matching</title>

  <script>
    window.__cssReady = new Promise((resolve) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '../src/dark-mode.css?cb=' + Date.now();
      link.onload = resolve;
      link.onerror = resolve;
      document.head.appendChild(link);
    });

    // Browsers pause requestAnimationFrame in a hidden tab and the grade
    // observer debounces through it, so without this nothing gets stamped.
    (function () {
      const native = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = function (fn) {
        if (document.hidden) return setTimeout(() => fn(performance.now()), 0);
        return native(fn);
      };
    })();
  </script>
</head>
<body>

  <div class="gradebook-table">
    <span id="g-good">47 / 50</span>
    <span id="g-fair">Score: 42 / 50</span>
    <span id="g-average">36/50</span>
    <span id="g-poor">20 / 50</span>
    <span id="g-percent">88%</span>
    <!-- In a gradebook a calendar-range pair is a score, not a date. -->
    <span id="g-ambiguous">9/10</span>

    <table>
      <tr><td id="g-cell">47 / 50</td></tr>
    </table>
  </div>

  <ul class="activity-group">
    <li class="stream-item-container">
      <div class="stream-item">
        <span id="s-grade">Grade posted: 47 / 50</span>
      </div>
    </li>
    <li class="stream-item-container">
      <div class="stream-item">
        <!-- Same shape as a score, but the stream is full of dates. -->
        <span id="s-date">9/19</span>
      </div>
    </li>
  </ul>

  <div class="gradebook-table">
    <span id="r-attempt">Attempt 1 / 3</span>
    <span id="r-attempt-labelled">Attempt: 1 / 3</span>
    <span id="r-question">Question 4 / 10</span>
    <span id="r-page">Page 2 / 10</span>
    <span id="r-progress">50% complete</span>
    <span id="r-progress-labelled">Progress: 50%</span>
    <span id="r-duedate">due Fri 12/5</span>
  </div>

  <div id="outside-any-root">
    <span id="o-score">47 / 50</span>
  </div>

  <script>
    (function () {
      const listeners = [];
      window.chrome = {
        storage: {
          local: {
            get(_key, cb) { setTimeout(() => cb({ darkModeEnabled: true }), 0); },
            set() {},
          },
        },
        runtime: { onMessage: { addListener(fn) { listeners.push(fn); } } },
      };
    })();

    window.__probe = function (id) {
      const el = document.getElementById(id);
      return {
        status: el.dataset.gradeStatus || null,
        pill: el.classList.contains('darkboard-pill'),
        display: getComputedStyle(el).display,
      };
    };

    window.__scriptReady = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = '../src/content.js?cb=' + Date.now();
      s.onload = resolve;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
