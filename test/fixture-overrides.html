<!DOCTYPE html>
<!-- Pure CSS, so the gate attribute is set directly and no content script loads. -->
<html lang="en" data-bb-dark>
<head>
  <meta charset="UTF-8" />
  <title>Darkboard fixture — override targeting</title>

  <script>
    window.__cssReady = new Promise((resolve) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      const sheet = new URLSearchParams(location.search).get('css') || '../src/dark-mode.css';
      link.href = sheet + '?cb=' + Date.now();
      link.onload = resolve;
      link.onerror = resolve;
      document.head.appendChild(link);
    });
  </script>
</head>
<body>

  <div class="course-filter">
    <label><span id="filter-label-span">Term</span></label>
  </div>

  <!-- A light background Blackboard would inline; the catcher should darken it. -->
  <div id="inline-light" style="background-color: rgb(245, 245, 245)">light</div>

  <!-- Already dark. Prefix matching cannot tell this from rgb(200, 200, 200),
       so it is caught too; the assertion records that it stays dark. -->
  <div id="inline-dark" style="background-color: rgb(20, 20, 20)">dark</div>

  <!-- Layout table: no header row, no role. Striping it reads as a fault. -->
  <table id="layout-table">
    <tr><td>one</td></tr>
    <tr><td id="layout-even">two</td></tr>
  </table>

  <table id="data-table">
    <thead><tr><th>Assignment</th></tr></thead>
    <tbody>
      <tr><td>one</td></tr>
      <tr><td id="data-even">two</td></tr>
    </tbody>
  </table>

  <div role="grid">
    <table>
      <tr><td>one</td></tr>
      <tr><td id="grid-even">two</td></tr>
    </table>
  </div>

  <!-- The MUI block hardcoded its colours behind a claim that JSS injection
       breaks variable scoping. It does not; these must resolve to the tokens. -->
  <label id="mui-label" class="MuiFormLabel-root">Term</label>

  <!-- aria-expanded marks the trigger, not the panel it opens. -->
  <button id="expanded-trigger" aria-expanded="true">Open menu</button>
  <div id="selected-item" aria-selected="true">Selected item</div>

  <script>
    window.__rowBackground = function (cellId) {
      return getComputedStyle(document.getElementById(cellId).closest('tr')).backgroundColor;
    };

    window.__rules = function () {
      return [...document.styleSheets]
        .flatMap(sheet => { try { return [...sheet.cssRules]; } catch (e) { return []; } })
        .filter(rule => rule.selectorText);
    };

    window.__selectorsContaining = function (needle) {
      return window.__rules()
        .map(r => r.selectorText)
        .filter(text => text.includes(needle));
    };

    // A bare `h` type selector is the signature of the stray character: the
    // comma closed the previous selector, so the h bound to the next line.
    window.__bareTypeSelectors = function () {
      return window.__rules()
        .flatMap(r => r.selectorText.split(','))
        .map(s => s.trim())
        .filter(s => /^h\s/.test(s));
    };

    // The stream hover is a :hover rule, so read the declaration itself rather
    // than trying to synthesise a pointer.
    window.__declarationsFor = function (needle, prop) {
      return window.__rules()
        .filter(r => r.selectorText.includes(needle) && r.style[prop])
        .map(r => r.style[prop]);
    };

    window.__probe = function (id) {
      const cs = getComputedStyle(document.getElementById(id));
      return { background: cs.backgroundColor, color: cs.color };
    };

    window.__token = function (name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    };
  </script>
</body>
</html>
