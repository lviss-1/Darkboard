<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Darkboard fixture — popup</title>
  <script>
    // Loaded through document.write so it stays synchronous while still carrying
    // a cache buster; http.server otherwise serves a stale helper and the
    // threshold assertions below quietly test the wrong code.
    document.write('<script src="contrast.js?cb=' + Date.now() + '"><\/script>');
  </script>
</head>
<body>

  <iframe id="popup" width="320" height="600" style="border: 0"></iframe>

  <script>
    // popup.js calls chrome.runtime.getManifest() at the top level, so the page
    // cannot simply be loaded and probed. Fetching it and re-rendering through
    // srcdoc allows a stub to be injected ahead of it. srcdoc resolves relative
    // URLs against this document, so <base> is what keeps the icon, fonts and
    // script pointing at the repo root.
    // ?site= picks what the active tab is, which is how the popup decides
    // what to show under the toggle:
    //   static     an Iona page the manifest covers (the default)
    //   granted    another school the user has enabled; beta panel + remove
    //   candidate  another school's Blackboard, not enabled; the enable button
    //   other      not Blackboard at all; the scope note
    // ?offscope is kept as the old spelling of ?site=other.
    const params = new URLSearchParams(location.search);
    const SITE = params.get('site') || (params.has('offscope') ? 'other' : 'static');
    const NO_ID = params.has('noid');
    const TAB_URL = {
      static: 'https://online.iona.edu/ultra/stream',
      granted: 'https://learn.example.edu/ultra/stream',
      candidate: 'https://learn.example.edu/ultra/course',
      other: 'https://example.com/',
    }[SITE];

    // The stub has to answer everything popup.js touches at load: the
    // manifest's content_scripts[0].matches, chrome.tabs.query both with and
    // without those patterns, and chrome.permissions.contains. Any one missing
    // throws and takes the whole popup script with it, which would leave every
    // assertion below testing a blank page rather than a popup. tabs.query
    // answers a callback or a promise because popup.js uses both forms.
    // Under static, the URL-filtered query matches; under anything else it
    // comes back empty, which is what Chrome does for a tab off those patterns.
    const STUB = `<base href="../">
      <script>
        window.__permissionCalls = [];
        window.__storageSets = [];
        window.chrome = {
          runtime: {
            getManifest: () => ({
              version: '0.0.0',
              content_scripts: [{ matches: ['https://online.iona.edu/*'] }],
            }),
            sendMessage: () => Promise.resolve(),
            lastError: undefined,
            // ?noid drops the runtime id, which is what an unpacked build
            // looks like. Nothing in the popup reads it any more — that is the
            // point of the scenario now. The review link used to be assembled
            // from it and therefore broke on exactly this install, so the
            // assertion is that the link is unaffected by its absence.
            id: ${NO_ID ? 'undefined' : "'ogkjalalkednannikfgjhcnmgcepkeip'"},
          },
          storage: { local: { get: (k, cb) => cb({}), set: (v) => window.__storageSets.push(v) } },
          tabs: {
            query: (q, cb) => {
              const hit = !q.url || ${JSON.stringify(SITE)} === 'static';
              const tabs = hit ? [{ id: 1, url: ${JSON.stringify(TAB_URL)} }] : [];
              return cb ? cb(tabs) : Promise.resolve(tabs);
            },
          },
          permissions: {
            contains: () => Promise.resolve(${JSON.stringify(SITE)} === 'granted'),
            request: (p) => { window.__permissionCalls.push(['request', p]); return Promise.resolve(true); },
            remove: (p) => { window.__permissionCalls.push(['remove', p]); return Promise.resolve(true); },
          },
        };
      <\/script>`;

    window.__ready = (async () => {
      const html = await fetch('../popup.html?cb=' + Date.now()).then(r => r.text());
      const frame = document.getElementById('popup');

      await new Promise((resolve) => {
        frame.addEventListener('load', resolve, { once: true });
        frame.srcdoc = html.replace('<head>', '<head>' + STUB);
      });

      // Give the injected script and webfonts a frame to settle.
      await new Promise(r => setTimeout(r, 200));
      return frame.contentDocument;
    })();

    window.__probe = async function () {
      const doc = await window.__ready;
      const win = doc.defaultView;
      const root = win.getComputedStyle(doc.documentElement);
      const token = (name) => root.getPropertyValue(name).trim();
      const colorOf = (sel) => win.getComputedStyle(doc.querySelector(sel)).color;

      // Elements carrying their own text, so a wrapper's inherited size does
      // not mask a child that is actually too small.
      const undersized = [...doc.querySelectorAll('*')]
        .filter(el => [...el.childNodes].some(n => n.nodeType === 3 && n.data.trim()))
        .map(el => ({
          label: el.className || el.tagName,
          size: parseFloat(win.getComputedStyle(el).fontSize),
        }))
        .filter(entry => entry.size < 11);

      const logo = doc.querySelector('.logo-icon');
      const pills = [...doc.querySelectorAll('.scope-pill')].map(el => el.textContent.trim());

      return {
        background: win.getComputedStyle(doc.body).backgroundColor,
        muted: colorOf('.toggle-subtitle'),
        link: colorOf('.footer-text a'),
        accentLight: token('--c-accent-light'),
        focusRuleUsesToken: [...doc.styleSheets]
          .flatMap(sheet => [...sheet.cssRules])
          .some(rule => (rule.selectorText || '').includes('focus-visible')
                     && (rule.style.outline || '').includes('--c-accent-light')),
        undersized,
        logoTag: logo.tagName,
        logoSrc: logo.getAttribute('src') || '',
        appNameFill: win.getComputedStyle(doc.querySelector('.app-name')).webkitTextFillColor,
        pills,
        hasEmoji: /\p{Extended_Pictographic}/u.test(doc.body.textContent),

        // The out-of-scope note, and proof the popup script survived load at
        // all: if chrome.tabs or content_scripts were missing from the stub,
        // popup.js would have thrown before ever setting the version tag.
        scopeNoteHidden: doc.getElementById('scopeNote').hidden,
        scopeNoteColor: colorOf('.scope-note'),
        versionTagFilled: doc.getElementById('versionTag').textContent !== '',
        toggleEnabled: !doc.getElementById('darkToggle').disabled,
        titleLabelsToggle:
          doc.querySelector('.toggle-title').getAttribute('for') === 'darkToggle',
        statusIsLive:
          doc.getElementById('statusText').getAttribute('aria-live') === 'polite',

        // The course-cards switch: absent preference means on, like dark mode,
        // and its label must name the right input.
        cards: (() => {
          const input = doc.getElementById('cardsToggle');
          const label = doc.querySelector('label[for="cardsToggle"]');
          const subtitle = doc.querySelector('#cardsCard .toggle-subtitle');
          const surface = win.getComputedStyle(doc.getElementById('cardsCard')).backgroundColor;
          return {
            checkedByDefault: input.checked,
            labelled: !!label && label.textContent.trim() === 'COURSE CARDS',
            titleContrast: __contrast(win.getComputedStyle(label).color, surface),
            subtitleContrast: __contrast(win.getComputedStyle(subtitle).color, surface),
          };
        })(),

        // The rating prompt. It must point at this extension's own published
        // listing, and must do so whether or not a runtime id exists — an
        // unpacked build gets a locally generated one, which is how this link
        // came to point at a listing that does not exist.
        rateHidden: doc.getElementById('rateLink').hidden,
        rateHref: doc.getElementById('rateLink').getAttribute('href'),
        rateReachesStore: /^https:\/\/chromewebstore\.google\.com\/detail\/[^/]+\/ogkjalalkednannikfgjhcnmgcepkeip/
          .test(doc.getElementById('rateLink').getAttribute('href') || ''),
        rateColor: colorOf('.rate-link'),

        // The site panel. Contrast is measured against what is actually
        // behind each part: the panel surface for text, the popup background
        // for the button's edge.
        site: (() => {
          const panel = doc.getElementById('sitePanel');
          const action = doc.getElementById('siteAction');
          const report = doc.getElementById('siteReport');
          const style = (el) => win.getComputedStyle(el);
          const surface = style(panel).backgroundColor;
          const fill = style(action).backgroundColor;
          const actionBg = fill === 'rgba(0, 0, 0, 0)' ? surface : fill;
          return {
            panelHidden: panel.hidden,
            title: doc.getElementById('siteTitle').textContent,
            detail: doc.getElementById('siteDetail').textContent,
            actionHidden: action.hidden,
            actionLabel: action.textContent,
            reportHidden: report.hidden,
            reportHref: report.getAttribute('href'),
            titleContrast: __contrast(style(doc.getElementById('siteTitle')).color, surface),
            detailContrast: __contrast(style(doc.getElementById('siteDetail')).color, surface),
            actionLabelContrast: __contrast(style(action).color, actionBg),
            actionEdgeContrast: __contrast(style(action).borderTopColor, surface),
            reportContrast: __contrast(style(report).color, surface),
          };
        })(),
      };
    };

    // Flips the course-cards switch and reports what was written to storage.
    window.__clickCardsToggle = async function () {
      const doc = await window.__ready;
      doc.getElementById('cardsToggle').click();
      return { checked: doc.getElementById('cardsToggle').checked, sets: doc.defaultView.__storageSets };
    };

    // Clicks the site panel's button and reports what the popup asked Chrome
    // for and what it shows afterwards. The stub grants and removes every time.
    window.__clickSiteAction = async function () {
      const doc = await window.__ready;
      doc.getElementById('siteAction').click();
      await new Promise(r => setTimeout(r, 50));
      return {
        calls: doc.defaultView.__permissionCalls,
        title: doc.getElementById('siteTitle').textContent,
        detail: doc.getElementById('siteDetail').textContent,
        actionHidden: doc.getElementById('siteAction').hidden,
        actionLabel: doc.getElementById('siteAction').textContent,
        pills: [...doc.querySelectorAll('.scope-pill')].map(el => el.textContent.trim()),
      };
    };
  </script>
</body>
</html>
