<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Darkboard fixture — modal scrims</title>

  <script>
    document.write('<script src="contrast.js?cb=' + Date.now() + '"><\/script>');
    document.write('<script src="restyle.js?cb=' + Date.now() + '"><\/script>');
  </script>

  <script>
    window.__cssReady = new Promise((resolve) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '../src/dark-mode.css?cb=' + Date.now();
      link.onload = () => setTimeout(resolve, 60);
      link.onerror = () => setTimeout(resolve, 60);
      document.head.appendChild(link);
    });
  </script>

  <script>
    // requestAnimationFrame is paused in a hidden tab and the pass debounces
    // through it, so without this the page appears to do nothing and every
    // assertion fails for the wrong reason.
    (function () {
      const native = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = function (fn) {
        if (document.hidden) return setTimeout(() => fn(performance.now()), 0);
        return native(fn);
      };
    })();
  </script>

  <style>
    /* How a portal-rendered scrim is actually built: fixed, covering the
       viewport, and setting NO background of its own. That is the whole point.
       The closed one is hidden by letting clicks through; the open one is not.
       Neither names itself "overlay" or "backdrop", which is exactly the case
       the stylesheet's name list cannot see — measured on the live site, a
       div like this comes out opaque rgb(10, 10, 12) even with no class. */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 900;
    }
    .is-closed { pointer-events: none; }
    .is-open   { pointer-events: auto; }

    /* A positioned, full-viewport element that is NOT a scrim: it carries the
       page's content. The pass must leave this alone, or it becomes the same
       blanket mistake in a new place. */
    #app-root {
      position: absolute;
      inset: 0;
      padding: 20px;
      font: 14px system-ui;
    }

    .dialog { position: fixed; top: 30%; left: 30%; width: 380px; z-index: 1000; padding: 16px; }
  </style>
</head>
<body>

  <div id="app-root">
    <h1 id="heading">Course content behind the scrim</h1>
    <p id="copy">If a scrim is painting when it should not be, this disappears.</p>
  </div>

  <!-- Mounted but closed. Must put no ink on the screen at all. -->
  <div class="scrim is-closed modal-mask" id="closed-scrim"></div>

  <!-- The shape taken from the live site: Fluent UI's ms-Layer, a body-level
       portal host that is fixed, full-viewport, and carries the overlay's own
       content. Measured on real Blackboard at rgb(10, 10, 12) — opaque
       page-black — and hidden only by visibility while closed. It must end up
       transparent whether open or closed: the panel inside paints its own
       surface, and a dim here would double with the scrim's own. -->
  <div class="scrim is-open ms-Layer ms-Layer--fixed" id="layer-host">
    <div class="ms-Layer-content" id="layer-content">Contextual menu contents</div>
  </div>

  <!-- Open, and a sibling of the dialog: the portal shape. Must dim rather
       than black out, so the page behind stays visible. -->
  <div id="portal">
    <div class="scrim is-open bb-dialog-container" id="open-scrim"></div>
    <div class="dialog" role="dialog" aria-modal="true" id="dialog">
      <h2 id="dialog-title">Delete File</h2>
      <p id="dialog-copy">Are you sure you want to delete this file?</p>
    </div>
  </div>

  <!-- The reported shape: a scrim that WRAPS its modal, so it carries the
       dialog's text. Judged by shape this reads as a layer host and clears,
       which is exactly why the dim never appeared on the live site. Judged by
       modality it is a scrim and must dim. -->
  <div class="scrim is-open bb-modal-shade" id="wrapping-scrim">
    <div class="dialog" role="dialog" aria-modal="true" id="wrapped-dialog">
      <h2>Wrapped</h2>
      <p>A dialog rendered inside its own scrim.</p>
    </div>
  </div>

  <!-- A scrim that lets clicks through while its modal is open: interaction is
       trapped on the dialog instead. pointer-events alone would read this as
       closed. It is not. -->
  <div id="click-through-portal">
    <div class="scrim is-closed passthrough-shade" id="passthrough-scrim"></div>
    <div class="dialog" role="alertdialog" id="passthrough-dialog">
      <p>Interaction is trapped here, not on the scrim.</p>
    </div>
  </div>

  <!-- Nested: a scrim inside a layer host, both full-viewport, both serving the
       same modal. Exactly ONE may paint — two 0.65 washes composite to 0.88 and
       put us most of the way back to the black screen. -->
  <div class="scrim is-open ms-Layer nested-outer" id="nested-outer">
    <div class="scrim is-open nested-inner" id="nested-inner">
      <div class="dialog" role="dialog" aria-modal="true" id="nested-dialog">
        <p>Nested</p>
      </div>
    </div>
  </div>

  <script>
    // prefers-reduced-transparency is controlled here rather than read from the
    // host, because the host's own setting is not neutral: it is ON for this
    // project's author and for the Browser pane these fixtures run in, so the
    // default-path assertions below silently tested the reduced path instead
    // and reported the wrong flavour as a failure. A fixture that changes
    // meaning with a system preference is not a test.
    (function () {
      let reduced = false;
      const listeners = new Set();
      const real = window.matchMedia.bind(window);

      window.matchMedia = (q) => {
        if (!/prefers-reduced-transparency/.test(q)) return real(q);
        const wantsReduce = /reduce/.test(q);
        const view = {
          media: q,
          get matches() { return wantsReduce ? reduced : !reduced; },
          addEventListener: (_t, fn) => listeners.add(fn),
          removeEventListener: (_t, fn) => listeners.delete(fn),
          addListener: (fn) => listeners.add(fn),
          removeListener: (fn) => listeners.delete(fn),
        };
        return view;
      };

      // Notifying listeners is what makes this exercise the real path: content.js
      // registers a change handler precisely because nothing in the DOM moves
      // when the preference flips, so a fixture that only mutated the DOM would
      // be testing a different mechanism than the one that ships.
      window.__setReducedTransparency = (v) => {
        reduced = !!v;
        for (const fn of listeners) fn({ matches: reduced, media: '(prefers-reduced-transparency: reduce)' });
      };
    })();

    (function () {
      const initialEnabled = !new URLSearchParams(location.search).has('off');
      const listeners = [];
      try { localStorage.removeItem('darkboard.enabled'); } catch (e) {}

      window.chrome = {
        storage: {
          local: {
            get(_key, cb) { setTimeout(() => cb({ darkModeEnabled: initialEnabled }), 0); },
            set() {},
          },
        },
        runtime: { onMessage: { addListener(fn) { listeners.push(fn); } } },
      };

      window.__fireToggle = function (enabled) {
        listeners.forEach(fn => fn({ type: 'BB_DARK_MODE_TOGGLE', enabled }));
      };

      const parse = (v) => {
        const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/.exec(v || '');
        return m ? { r: +m[1], g: +m[2], b: +m[3], a: m[4] === undefined ? 1 : +m[4] } : null;
      };

      const state = (id) => {
        const el = __restyleTree(document.getElementById(id));
        const cs = getComputedStyle(el);
        const bg = parse(cs.backgroundColor);
        return {
          bg: cs.backgroundColor,
          alpha: bg ? bg.a : null,
          painting: !!bg && bg.a > 0.01,
          opaque: !!bg && bg.a > 0.99,
          mark: el.getAttribute('data-darkboard-scrim'),
          inline: el.style.getPropertyValue('background-color'),
          blur: cs.backdropFilter,
        };
      };
      window.__state = state;

      window.__probe = function () {
        const failures = [];
        const closed = state('closed-scrim');
        const open = state('open-scrim');
        const dialog = state('dialog');
        const appRoot = state('app-root');

        // The reported bug. A closed scrim inherits the dark canvas and turns
        // into a full-viewport opaque sheet; the page is fine underneath and
        // nobody can see it.
        if (closed.painting) {
          failures.push('closed scrim is painting ' + closed.bg + ' (should paint nothing)');
        }
        if (closed.mark !== 'clear') {
          failures.push('closed scrim mark is ' + closed.mark + ', expected "clear"');
        }

        // An open scrim dims. It must never be opaque — that is the same bug
        // wearing a different hat, and it is what the screenshot shows.
        if (open.opaque) {
          failures.push('open scrim is OPAQUE ' + open.bg + ' — the page behind is gone');
        }
        if (!open.painting) {
          failures.push('open scrim is not dimming at all: ' + open.bg);
        }
        if (open.mark !== 'dim') {
          failures.push('open scrim mark is ' + open.mark + ', expected "dim"');
        }

        // The dialog itself is not a scrim and must keep its raised surface.
        if (!dialog.opaque) {
          failures.push('dialog lost its opaque surface: ' + dialog.bg);
        }
        if (dialog.mark) {
          failures.push('dialog was marked as a scrim');
        }

        // The false-positive guard: a positioned full-viewport element that
        // carries content is a layout container, not a scrim.
        if (appRoot.mark) {
          failures.push('app root was marked as a scrim (' + appRoot.mark + ')');
        }

        // The Fluent layer host. Opaque here is the live bug; dimmed here
        // would veil the whole page every time a context menu opens.
        const layer = state('layer-host');
        if (layer.painting) {
          failures.push('layer host is painting ' + layer.bg + ' (should paint nothing)');
        }
        if (layer.mark !== 'clear') {
          failures.push('layer host mark is ' + layer.mark + ', expected "clear"');
        }

        // The reported bug: a scrim that wraps its own modal carries the
        // dialog's text, reads as a layer host, and never dims.
        const wrapping = state('wrapping-scrim');
        if (wrapping.mark !== 'dim') {
          failures.push('wrapping scrim mark is ' + wrapping.mark + ', expected "dim"');
        }

        // pointer-events: none must not read as "closed" while its modal is up.
        const passthrough = state('passthrough-scrim');
        if (passthrough.mark !== 'dim') {
          failures.push('click-through scrim mark is ' + passthrough.mark + ', expected "dim"');
        }

        // Exactly one of a nested pair may paint.
        const outer = state('nested-outer');
        const inner = state('nested-inner');
        if (inner.mark !== 'dim') {
          failures.push('nested inner mark is ' + inner.mark + ', expected "dim" (innermost wins)');
        }
        if (outer.painting) {
          failures.push('nested outer is also painting ' + outer.bg + ' — two washes stack');
        }

        // Every dim carries the blur; every clear carries none. The blur is the
        // only lever that recovers what a dark canvas cannot do with luminance,
        // and blurring an INACTIVE scrim is the original section 10 bug.
        for (const [id, st] of Object.entries({ 'open-scrim': open, 'wrapping-scrim': wrapping,
                                                'passthrough-scrim': passthrough, 'nested-inner': inner })) {
          if (!/blur/.test(st.blur || '')) failures.push(id + ' is dimmed but not blurred: ' + st.blur);
        }
        for (const [id, st] of Object.entries({ 'closed-scrim': closed, 'layer-host': state('layer-host'),
                                                'nested-outer': outer })) {
          if (/blur/.test(st.blur || '')) failures.push(id + ' is cleared but still blurring: ' + st.blur);
        }

        // The dim itself, now 0.65. Asserted as a range so retuning does not
        // mean rewriting the test, but tight enough to catch a stacked wash.
        for (const [id, st] of Object.entries({ 'open-scrim': open, 'wrapping-scrim': wrapping,
                                                'nested-inner': inner })) {
          if (st.alpha !== null && (st.alpha < 0.55 || st.alpha > 0.75)) {
            failures.push(id + ' alpha is ' + st.alpha + ', expected ~0.65');
          }
        }

        // And the page behind has to still be readable.
        const heading = getComputedStyle(__restyleTree(document.getElementById('heading')));
        if (__contrast(heading.color, '#0a0a0c') < 4.5) {
          failures.push('heading is not readable against the page');
        }

        return { failures, closed, open, dialog, appRoot, layer: state('layer-host') };
      };

      // A reader who has asked for reduced transparency gets the blur removed
      // and a slightly denser wash in its place — not a solid backdrop. The
      // page behind a modal still has to be visible; that requirement does not
      // go away because someone dislikes see-through panels.
      window.__probeReducedTransparency = async function () {
        const failures = [];
        const results = {};
        // No DOM nudge: flipping the switch fires the media-query listener that
        // content.js registers, which is the mechanism under test.
        const settle = () => new Promise((r) => setTimeout(r, 500));

        window.__setReducedTransparency(true);
        await settle();

        for (const id of ['open-scrim', 'wrapping-scrim', 'passthrough-scrim', 'nested-inner']) {
          const st = state(id);
          results[id] = st;
          if (st.mark !== 'dim-sharp') {
            failures.push(id + ' mark is ' + st.mark + ', expected "dim-sharp"');
          }
          if (/blur/.test(st.blur || '')) {
            failures.push(id + ' still blurs under reduced transparency: ' + st.blur);
          }
          if (st.alpha !== null && (st.alpha < 0.7 || st.alpha > 0.8)) {
            failures.push(id + ' alpha is ' + st.alpha + ', expected ~0.75');
          }
          // The page behind must survive the preference. An opaque backdrop
          // here would be the black screen again, just better motivated.
          if (st.alpha === 1) {
            failures.push(id + ' went fully opaque — the page behind is gone');
          }
        }

        // Clearing is unaffected: an inert scrim still paints nothing and a
        // menu host still clears.
        for (const id of ['closed-scrim', 'layer-host', 'nested-outer']) {
          const st = state(id);
          results[id] = st;
          if (st.painting) failures.push(id + ' is painting under reduced transparency: ' + st.bg);
        }

        // And it must go back on its own when the preference is withdrawn,
        // which is what the media-query listener in content.js is for.
        window.__setReducedTransparency(false);
        await settle();
        const back = state('open-scrim');
        results.restored = back;
        if (back.mark !== 'dim') {
          failures.push('after restoring, open-scrim mark is ' + back.mark + ', expected "dim"');
        }
        if (!/blur/.test(back.blur || '')) {
          failures.push('after restoring, open-scrim lost its blur: ' + back.blur);
        }

        return { failures, results };
      };

      // Switching dark mode off must take the inline styles back off with it:
      // they are not gated by [data-bb-dark] and would otherwise persist.
      window.__probeOff = function () {
        const failures = [];
        const marks = document.querySelectorAll('[data-darkboard-scrim]').length;
        if (marks) failures.push(marks + ' scrim marks survived the toggle off');
        for (const id of ['closed-scrim', 'open-scrim', 'wrapping-scrim', 'nested-inner']) {
          const el = document.getElementById(id);
          const inline = el.style.getPropertyValue('background-color');
          if (inline) failures.push(id + ' kept an inline background: ' + inline);
          const bf = el.style.getPropertyValue('backdrop-filter');
          if (bf) failures.push(id + ' kept an inline backdrop-filter: ' + bf);
        }
        return { failures };
      };
    })();
  </script>

  <script>
    window.__scriptReady = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = '../src/content.js?cb=' + Date.now();
      s.onload = resolve;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
